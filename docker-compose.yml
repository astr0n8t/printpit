# Simple single-network deployment. Put a TLS-terminating reverse proxy in front of it,
# or set PRINTPIT_SECURE_COOKIES=false for plain-HTTP testing on a trusted network.
#
#   echo "PRINTPIT_SECRET_KEY=$(openssl rand -base64 32)" > .env
#   docker compose up -d
#
# For a segmented setup (UI and printer traffic on separate networks, TLS via Caddy), see
# docker-compose.segmented.yml.
#
# Optional slicing with OrcaSlicer (README "Slicing"):
#   echo "PRINTPIT_SLICER_URL=http://slicer:8090" >> .env
#   echo "PRINTPIT_SLICER_TOKEN=$(openssl rand -hex 32)" >> .env
#   docker compose --profile slicer up -d
services:
  printpit:
    image: printpit:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PRINTPIT_SECRET_KEY: ${PRINTPIT_SECRET_KEY:?set PRINTPIT_SECRET_KEY in .env}
      PRINTPIT_SECURE_COOKIES: ${PRINTPIT_SECURE_COOKIES:-true}
      # Optional print notifications (see README). Empty means off.
      PRINTPIT_NOTIFY_WEBHOOK_URL: ${PRINTPIT_NOTIFY_WEBHOOK_URL:-}
      # Optional slicing (see README "Slicing"): set both in .env and start with
      # `docker compose --profile slicer up -d`. Empty means off.
      PRINTPIT_SLICER_URL: ${PRINTPIT_SLICER_URL:-}
      PRINTPIT_SLICER_TOKEN: ${PRINTPIT_SLICER_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - printpit-data:/data
    networks:
      - default
      - slicer
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Optional OrcaSlicer worker. Only started with `--profile slicer`. It parses untrusted model
  # files, so it gets no network but the internal one shared with printpit (no internet, no
  # printers), a read-only root, a tmpfs for its work, and CPU/memory limits.
  slicer:
    image: printpit-slicer:latest
    build:
      context: .
      dockerfile: Dockerfile.slicer
    profiles: [slicer]
    restart: unless-stopped
    environment:
      # The same token printpit has. The worker refuses to start without one.
      PRINTPIT_SLICER_TOKEN: ${PRINTPIT_SLICER_TOKEN:-}
      PRINTPIT_SLICER_TIMEOUT_SECS: ${PRINTPIT_SLICER_TIMEOUT_SECS:-900}
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - slicer
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 256

networks:
  default:
  # printpit <-> slicer only; nothing on it can reach anything else.
  slicer:
    internal: true

volumes:
  printpit-data:
