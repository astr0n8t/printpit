# Simple single-network deployment. Put a TLS-terminating reverse proxy in front of it,
# or set PRINTPIT_SECURE_COOKIES=false for plain-HTTP testing on a trusted network.
#
#   echo "PRINTPIT_SECRET_KEY=$(openssl rand -base64 32)" > .env
#   docker compose up -d
#
# For a segmented setup (UI and printer traffic on separate networks, TLS via Caddy), see
# docker-compose.segmented.yml.
services:
  printpit:
    image: printpit:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PRINTPIT_SECRET_KEY: ${PRINTPIT_SECRET_KEY:?set PRINTPIT_SECRET_KEY in .env}
      PRINTPIT_SECURE_COOKIES: ${PRINTPIT_SECURE_COOKIES:-true}
      # Optional print notifications (see README). Empty means off.
      PRINTPIT_NOTIFY_WEBHOOK_URL: ${PRINTPIT_NOTIFY_WEBHOOK_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - printpit-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  printpit-data:
