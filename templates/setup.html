{% extends "auth_page.html" %}
{% block panel %}
<section class="panel">
  <h2 class="panel-title">first-run setup</h2>
  <p>No users exist yet. Create the admin account.</p>
  <p class="dim">The setup token is printed in the server log (<code>docker logs printpit</code>).</p>
{%- if let Some(msg) = error %}
  <p class="err" role="alert">! {{ msg }}</p>
{%- endif %}
  <form method="post" action="/setup">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <div class="field">
      <label for="token">setup token</label>
      <input id="token" name="token" autocomplete="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx-xxxx" required autofocus>
    </div>
    <div class="field">
      <label for="username">admin username</label>
      <input id="username" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="password">password <span class="dim">(min 8 chars)</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field">
      <label for="confirm">confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="actions"><button type="submit" class="primary">create admin</button></div>
  </form>
</section>
{% endblock %}
