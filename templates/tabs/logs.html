{%- if let Some(sel) = select %}
<div class="tab-head">{{ sel|safe }}</div>
<div id="logs" hx-get="{{ list_url }}" hx-trigger="load"><p class="dim">loading…</p></div>
{%- else %}
<section class="panel">
  <h2 class="panel-title">logs</h2>
  <p>No printers configured yet.</p>
</section>
{%- endif %}
