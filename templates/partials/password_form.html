<section class="panel" id="password-panel">
  <h2 class="panel-title">change password</h2>
{%- if let Some(msg) = error %}
  <p class="err" role="alert">! {{ msg }}</p>
{%- endif %}
{%- if let Some(msg) = success %}
  <p class="ok" role="status">✓ {{ msg }}</p>
{%- endif %}
  <form method="post" action="/account/password" hx-post="/account/password" hx-target="#password-panel" hx-swap="outerHTML">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <div class="field">
      <label for="current">current password</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new">new password <span class="dim">(min 8 chars)</span></label>
      <input id="new" name="new" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field">
      <label for="confirm">confirm new password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="actions"><button type="submit" class="primary">change password</button></div>
    <p class="dim">Changing your password signs out your other sessions.</p>
  </form>
</section>
