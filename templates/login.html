{% extends "auth_page.html" %}
{% block panel %}
<section class="panel">
  <h2 class="panel-title">login</h2>
{%- if let Some(msg) = error %}
  <p class="err" role="alert">! {{ msg }}</p>
{%- endif %}
  <form method="post" action="/login">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
{%- if let Some(n) = next %}
    <input type="hidden" name="next" value="{{ n }}">
{%- endif %}
    <div class="field">
      <label for="username">username</label>
      <input id="username" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </div>
    <div class="field">
      <label for="password">password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="actions"><button type="submit" class="primary">sign in</button></div>
  </form>
</section>
{% endblock %}
