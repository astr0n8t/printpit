{% extends "auth_page.html" %}
{% block panel %}
<section class="panel">
  <h2 class="panel-title">two-factor sign-in</h2>
{%- if let Some(msg) = error %}
  <p class="err" role="alert">! {{ msg }}</p>
{%- endif %}
  <form method="post" action="/login/totp">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <div class="field">
      <label for="code">code from your authenticator app</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" maxlength="16" required autofocus>
      <p class="dim">Lost your phone? Enter one of your recovery codes instead.</p>
    </div>
    <div class="actions"><button type="submit" class="primary">verify</button> <a href="/login">start over</a></div>
  </form>
</section>
{% endblock %}
