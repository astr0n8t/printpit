{% extends "base.html" %}
{% block body %}
<header class="topbar">
  <a class="brand" href="/">▌printpit</a>
  {{ tabs|safe }}
{%- if let Some(token) = layout.csrf %}
  <form class="logout" method="post" action="/logout">
    <input type="hidden" name="_csrf" value="{{ token }}">
    <button type="submit">logout</button>
  </form>
{%- endif %}
</header>
<main id="main" class="main">{{ content|safe }}</main>
<dialog id="confirm" aria-labelledby="confirm-q">
  <form method="dialog">
    <p id="confirm-q"></p>
    <div class="actions">
      <button value="yes" class="danger">yes [y]</button>
      <button value="no" autofocus>no [n]</button>
    </div>
  </form>
</dialog>
<footer class="statusline">
  <span>printpit {{ layout.version }}{% if let Some(user) = layout.user %} · {{ user.username }} <span class="dim">({{ user.role }})</span>{% endif %}</span>
  <span class="dim">[1-4] tabs · [a] account</span>
</footer>
{% endblock %}
